# Build the driver and calibration firmware and publish them as a GitHub
# release. Runs on a pushed version tag (e.g. `git tag release-1.0.0 && git push
# origin release-1.0.0`). A manual run builds the images and uploads them as a
# workflow artifact only, without a release.

name: Release

on:
  push:
    tags: ["release-*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build the toolchain image with a GHA layer cache, so the SDK and
      # picotool are not rebuilt on every run. build.sh finds the image by tag
      # and skips its own `docker build`.
      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: servo2040-build
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build firmware
        run: ./build.sh --clean

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            dist/hexapod-servo2040-firmware.uf2
            dist/servo-calibration.uf2
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/hexapod-servo2040-firmware.uf2
            dist/servo-calibration.uf2
